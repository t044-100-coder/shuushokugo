<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修飾語マスター！言葉の魔法使い</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    .animate-wiggle {
      animation: wiggle 0.3s ease-in-out infinite;
    }
    @keyframes bossPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }
      50% { box-shadow: 0 0 40px rgba(239, 68, 68, 1); }
    }
    .boss-border {
      animation: bossPulse 1.5s infinite;
    }
    body {
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Segoe UI', sans-serif;
      touch-action: manipulation;
    }
    /* 赤い波線スタイル */
    .wavy-underline {
      text-decoration: underline wavy #ef4444;
      text-underline-offset: 6px;
    }
    /* ふりがなのスタイル */
    ruby {
      ruby-position: over;
    }
    rt {
      font-size: 0.55em;
      font-weight: normal;
      color: inherit;
    }
  </style>
</head>
<body class="bg-blue-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-500" id="gameBody">

  <div id="app" class="w-full max-w-2xl">
    <!-- コンテンツは JavaScript で動的に描画されます -->
  </div>

  <script>
    const questions = [
      // ----- レベル1 (1〜10) -----
      { id: 1, level: 1, text: "|大|【おお】きな ゾウが |歩|【ある】く。", target: "ゾウが", answers: ["大きな", "おおきな"], hint: "大" },
      { id: 2, level: 1, text: "すばやく |逃|【に】げる。", target: "|逃|【に】げる", answers: ["すばやく"], hint: "す" },
      { id: 3, level: 1, text: "あたたかい スープを |飲|【の】む。", target: "スープを", answers: ["あたたかい"], hint: "あ" },
      { id: 4, level: 1, text: "にこにこ |笑|【わら】う。", target: "|笑|【わら】う", answers: ["にこにこ"], hint: "に" },
      { id: 5, level: 1, text: "|高|【たか】い |山|【やま】に |登|【のぼ】る。", target: "|山|【やま】に", answers: ["高い", "たかい"], hint: "高" },
      { id: 6, level: 1, text: "きれいに |掃|【そう】|除|【じ】を する。", target: "|掃|【そう】|除|【じ】を", answers: ["きれいに"], hint: "き" },
      { id: 7, level: 1, text: "|新|【あたら】しい |靴|【くつ】を はく。", target: "|靴|【くつ】を", answers: ["新しい", "あたらしい"], hint: "新" },
      { id: 8, level: 1, text: "ゆっくり |話|【はな】す。", target: "|話|【はな】す", answers: ["ゆっくり"], hint: "ゆ" },
      { id: 9, level: 1, text: "|青|【あお】い |空|【そら】を |見|【み】|上|【あ】げる。", target: "|空|【そら】を", answers: ["青い", "あおい"], hint: "青" },
      { id: 10, level: 1, text: "|元|【げん】|気|【き】よく あいさつする。", target: "あいさつする", answers: ["元気よく", "げんきよく"], hint: "元" },

      // ----- レベル2 (11〜20) -----
      { id: 11, level: 2, text: "すごく おもしろい |本|【ほん】。", target: "おもしろい", answers: ["すごく"], hint: "す" },
      { id: 12, level: 2, text: "|来|【らい】|週|【しゅう】の |日|【にち】|曜|【よう】|日|【び】に |出|【で】かける。", target: "|日|【にち】|曜|【よう】|日|【び】に", answers: ["来週の", "らいしゅうの"], hint: "来" },
      { id: 13, level: 2, text: "さっき |届|【とど】いた |手|【て】|紙|【がみ】を |読|【よ】む。", target: "|届|【とど】いた", answers: ["さっき"], hint: "さ" },
      { id: 14, level: 2, text: "|校|【こう】|庭|【てい】で |元|【げん】|気|【き】に |遊|【あそ】ぶ。", target: "|遊|【あそ】ぶ", answers: ["元気に", "げんきに", "校庭で", "こうていで"], hint: "元" },
      { id: 15, level: 2, text: "とても |深|【ふか】い |海|【うみ】を |泳|【およ】ぐ。", target: "|深|【ふか】い", answers: ["とても"], hint: "と" },
      { id: 16, level: 2, text: "|真|【しん】|剣|【けん】に |練|【れん】|習|【しゅう】に はげむ。", target: "はげむ", answers: ["練習に", "れんしゅうに", "真剣に", "しんけんに"], hint: "練" },
      { id: 17, level: 2, text: "|静|【しず】かに ドアを |閉|【し】める。", target: "|閉|【し】める", answers: ["静かに", "しずかに"], hint: "静" },
      { id: 18, level: 2, text: "|夕|【ゆう】|方|【がた】 |友|【とも】|達|【だち】の |家|【いえ】に |集|【あつ】まる。", target: "|家|【いえ】に", answers: ["友達の", "ともだちの"], hint: "友" },
      { id: 19, level: 2, text: "かなり |速|【はや】く |走|【はし】る |電|【でん】|車|【しゃ】。", target: "|速|【はや】く", answers: ["かなり"], hint: "か" },
      { id: 20, level: 2, text: "しっかり |計|【けい】|画|【かく】を たてる。", target: "|計|【けい】|画|【かく】を", answers: ["しっかり"], hint: "し" },

      // ----- レベル3 (21〜30) -----
      { id: 21, level: 3, text: "|川|【かわ】の ながれが とても |速|【はや】い。", target: "|速|【はや】い", answers: ["とても"], hint: "と" },
      { id: 22, level: 3, text: "|来|【らい】|月|【げつ】の |発|【はっ】|表|【ひょう】|会|【かい】に|向|【む】けて |練|【れん】|習|【しゅう】する。", target: "|発|【はっ】|表|【ひょう】|会|【かい】に|向|【む】けて", answers: ["来月の", "らいげつの"], hint: "来" },
      { id: 23, level: 3, text: "|大|【おお】きな バスが |静|【しず】かに |街|【まち】を |走|【はし】り|去|【さ】る。", target: "バスが", answers: ["大きな", "おおきな"], hint: "大" },
      { id: 24, level: 3, text: "ぼくは |兄|【あに】と |映|【えい】|画|【が】|館|【かん】へ |行|【い】った。", target: "|行|【い】った", answers: ["ぼくは", "兄と", "あにと", "映画館へ", "えいがかんへ"], hint: "ぼ" },
      { id: 25, level: 3, text: "あでやかに |咲|【さ】いた |庭|【にわ】の バラ。", target: "|咲|【さ】いた", answers: ["あでやかに"], hint: "あ" },
      { id: 26, level: 3, text: "|姉|【あね】が さっき |焼|【や】いた パン。", target: "|焼|【や】いた", answers: ["姉が", "あねが", "さっき"], hint: "姉" },
      { id: 27, level: 3, text: "|遠|【とお】くの |街|【まち】から たくさんの |人|【ひと】が やってきた。", target: "|人|【ひと】が", answers: ["たくさんの", "遠くの", "とおくの"], hint: "た" },
      
      // ラスト3問：超難問ボス問題
      { id: 28, level: 3, text: "|激|【はげ】しい |風|【かぜ】を うけて たわむ しなやかな |竹|【たけ】。", target: "|竹|【たけ】", answers: ["しなやかな"], hint: "し", isBoss: true },
      { id: 29, level: 3, text: "|昨|【きのう】|日|【】 |友|【とも】|達|【だち】から |借|【か】りてきた |本|【ほん】を |夢|【む】|中|【ちゅう】で |読|【よ】む。", target: "|借|【か】りてきた", answers: ["昨日", "きのう", "友達から", "ともだちから"], hint: "昨", isBoss: true },
      { id: 30, level: 3, text: "とても |静|【しず】かな |夜|【よる】の |森|【もり】で フクロウが |鳴|【な】いた。", target: "|静|【しず】かな", answers: ["とても"], hint: "と", isBoss: true }
    ];

    let gameState = 'START';
    let currentQuestionIndex = 0;
    let userInput = '';
    let feedback = null;
    let isShaking = false;
    let showHint = false;

    function playSound(type) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
          osc.start();
          osc.stop(ctx.currentTime + 0.45);
        } else if (type === 'incorrect') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.setValueAtTime(160, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } else if (type === 'bossAlert') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch (e) {
        // Audio API restriction fallback
      }
    }

    function rubyHTML(str) {
      if (!str) return '';
      return str.replace(/\|([^|]+)\|【([^】]*)】/g, (match, kanji, reading) => {
        if (!reading) return kanji;
        return `<ruby>${kanji}<rt>${reading}</rt></ruby>`;
      });
    }

    function stripRuby(str) {
      if (!str) return '';
      return str.replace(/\|([^|]+)\|【[^】]*】/g, '$1');
    }

    function checkAnswer() {
      if (feedback !== null) return;

      const q = questions[currentQuestionIndex];
      if (!q) return;

      const inputEl = document.getElementById('answerInput');
      const val = inputEl ? inputEl.value : userInput;
      const cleanInput = val.trim().replace(/\s+/g, '').toLowerCase();

      if (!cleanInput) return;

      const validAnswers = q.answers || [];
      const isCorrect = validAnswers.some(ans => {
        if (!ans) return false;
        return ans.trim().replace(/\s+/g, '').toLowerCase() === cleanInput;
      });

      if (isCorrect) {
        feedback = 'CORRECT';
        playSound('correct');
        render();

        setTimeout(() => {
          feedback = null;
          userInput = '';
          showHint = false;

          if (currentQuestionIndex + 1 < questions.length) {
            const nextQ = questions[currentQuestionIndex + 1];
            if (nextQ.level !== q.level) {
              gameState = 'LEVEL_CLEAR';
            } else {
              currentQuestionIndex++;
              if (questions[currentQuestionIndex].isBoss) {
                playSound('bossAlert');
              }
            }
          } else {
            gameState = 'ALL_CLEAR';
          }
          render();
        }, 1200);

      } else {
        feedback = 'INCORRECT';
        isShaking = true;
        playSound('incorrect');
        render();

        setTimeout(() => {
          isShaking = false;
          feedback = null;
          render();
        }, 800);
      }
    }

    function toggleHint() {
      showHint = true;
      render();
    }

    function startGame() {
      gameState = 'PLAYING';
      currentQuestionIndex = 0;
      userInput = '';
      showHint = false;
      render();
    }

    function nextLevel() {
      currentQuestionIndex++;
      gameState = 'PLAYING';
      userInput = '';
      showHint = false;
      if (questions[currentQuestionIndex].isBoss) {
        playSound('bossAlert');
      }
      render();
    }

    function render() {
      const app = document.getElementById('app');
      const body = document.getElementById('gameBody');

      // 1. スタート画面
      if (gameState === 'START') {
        body.className = "bg-blue-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-500";
        app.innerHTML = `
          <div class="bg-white p-6 md:p-8 rounded-3xl shadow-xl text-center border-4 border-blue-400">
            <h1 class="text-3xl md:text-5xl font-bold text-blue-600 mb-4 drop-shadow-md leading-relaxed">
              ${rubyHTML('|修|【しゅう】|飾|【しょく】|語|【ご】マスター！')} <br/>
              <span class="text-2xl md:text-3xl text-orange-500">${rubyHTML('|言|【こと】|葉|【ば】の|魔|【ま】|法|【ほう】|使|【つか】い')}</span>
            </h1>
            <p class="text-base md:text-lg text-gray-700 mb-8 leading-relaxed">
              ${rubyHTML('|波|【なみ】|線|【せん】の|言|【こと】|葉|【ば】を「くわしく」|説|【せつ】|明|【めい】している|修|【しゅう】|飾|【しょく】|語|【ご】を<br/>じぶんの|手|【て】で|入|【にゅう】|力|【りょく】してこたえよう！')}<br/><br/>
              ${rubyHTML('ぜんぶで <strong>30|問|【もん】</strong>！ラストの|超|【ちょう】|難|【なん】|問|【もん】ボスを クリアできるかな？')}
            </p>
            <button onclick="startGame()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 px-10 rounded-full text-2xl shadow-lg transform transition active:scale-95">
              ${rubyHTML('ゲームスタート！')} 🚀
            </button>
          </div>
        `;
        return;
      }

      // 2. レベルクリア画面
      if (gameState === 'LEVEL_CLEAR') {
        const clearedLevel = questions[currentQuestionIndex].level;
        body.className = "bg-green-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-500";
        app.innerHTML = `
          <div class="bg-white p-8 rounded-3xl shadow-xl text-center border-4 border-green-400 animate-bounce">
            <h2 class="text-3xl md:text-4xl font-bold text-green-600 mb-4">${rubyHTML(`レベル ${clearedLevel} クリア！`)} 🎉</h2>
            <p class="text-lg md:text-xl text-gray-700 mb-8">${rubyHTML('すごい！じぶんで|考|【かんが】えて しっかり|入|【にゅう】|力|【りょく】できたね！')}<br/>${rubyHTML('つぎのレベルへ|進|【すす】もう！')}</p>
            <button onclick="nextLevel()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full text-xl shadow-lg transform transition active:scale-95">
              ${rubyHTML('つぎのレベルへ|挑|【ちょう】|戦|【せん】！')} ➡️
            </button>
          </div>
        `;
        return;
      }

      // 3. 全問クリア画面
      if (gameState === 'ALL_CLEAR') {
        body.className = "bg-yellow-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-500";
        app.innerHTML = `
          <div class="bg-white p-8 rounded-3xl shadow-2xl text-center border-4 border-yellow-400">
            <h2 class="text-4xl md:text-5xl font-bold text-yellow-500 mb-4 drop-shadow-lg">🏆 ${rubyHTML('|全|【ぜん】|問|【もん】クリア！')} 🏆</h2>
            <p class="text-2xl font-bold text-orange-500 mb-4">${rubyHTML('おめでとう！！')}</p>
            <p class="text-lg text-gray-700 mb-8">
              ${rubyHTML('キーボードやフリック|入|【にゅう】|力|【りょく】もバッチリ！')}<br/>
              ${rubyHTML('きみは もう |完|【かん】|全|【ぜん】な')}<strong class="text-2xl text-blue-600">${rubyHTML('「|修|【しゅう】|飾|【しょく】|語|【ご】マスター」')}</strong>${rubyHTML('だ！')}
            </p>
            <button onclick="startGame()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-full text-xl shadow-lg transform transition active:scale-95">
              ${rubyHTML('もう|一|【いち】|度|【ど】あそぶ')} 🔄
            </button>
          </div>
        `;
        return;
      }

      const q = questions[currentQuestionIndex];
      const isBoss = q.isBoss;

      if (isBoss) {
        body.className = "bg-gray-900 min-h-screen flex items-center justify-center p-4 transition-colors duration-500";
      } else {
        body.className = `${q.level === 1 ? 'bg-blue-100' : q.level === 2 ? 'bg-green-100' : 'bg-orange-100'} min-h-screen flex items-center justify-center p-4 transition-colors duration-500`;
      }

      // 問題文の整形
      const textParts = q.text.split(' ').map(word => {
        const cleanWord = stripRuby(word);
        const cleanTarget = stripRuby(q.target);
        
        if (cleanWord === cleanTarget || word === q.target) {
          return `<span class="text-red-500 font-extrabold wavy-underline">${rubyHTML(word)}</span>`;
        }
        return `<span class="${isBoss ? 'text-white' : 'text-gray-800'}">${rubyHTML(word)}</span>`;
      }).join(' ');

      let feedbackHtml = '<div class="h-12"></div>';
      const mainAnswer = q.answers ? q.answers[0] : '';
      const hintChar = q.hint || mainAnswer.charAt(0);

      if (feedback === 'CORRECT') {
        feedbackHtml = `
          <div class="h-12 flex items-center justify-center text-2xl md:text-3xl font-bold text-green-500 animate-bounce">
            ⭕️ ${rubyHTML('|大|【だい】|正|【しょう】|解|【かい】！')}（${mainAnswer}）
          </div>
        `;
      } else if (feedback === 'INCORRECT') {
        feedbackHtml = `
          <div class="h-12 flex items-center justify-center text-xl md:text-2xl font-bold text-red-500">
            ❌ ${rubyHTML('ちがうよ！もう|一|【いち】|度|【ど】|考|【かんが】えてみよう！')}
          </div>
        `;
      }

      app.innerHTML = `
        <div class="mb-4">
          <div class="flex justify-between mb-1 font-bold ${isBoss ? 'text-red-400' : 'text-blue-700'}">
            <span>${rubyHTML(`レベル ${q.level}`)} ${isBoss ? rubyHTML('【ボス|問|【もん】|題|【だい】！】') : ''}</span>
            <span>${currentQuestionIndex + 1} / 30 ${rubyHTML('|問|【もん】')}</span>
          </div>
          <div class="w-full bg-gray-300 rounded-full h-4 overflow-hidden">
            <div class="${isBoss ? 'bg-red-500' : 'bg-blue-500'} h-4 rounded-full transition-all duration-300" style="width: ${((currentQuestionIndex + 1) / 30) * 100}%"></div>
          </div>
        </div>

        <div class="p-6 md:p-8 rounded-3xl shadow-2xl text-center border-4 ${isBoss ? 'bg-gray-800 border-red-500 boss-border' : 'bg-white border-blue-300'} ${isShaking ? 'animate-wiggle' : ''}">
          
          ${isBoss ? `
            <div class="mb-3">
              <span class="bg-red-600 text-white font-bold px-4 py-1 rounded-full text-sm tracking-widest animate-pulse">
                ⚠️ ${rubyHTML('|超|【ちょう】|難|【なん】|問|【もん】アラート')} ⚠️
              </span>
            </div>
          ` : ''}

          <h2 class="text-lg md:text-2xl font-bold mb-4 ${isBoss ? 'text-gray-200' : 'text-gray-700'} leading-relaxed">
            ${rubyHTML('|波|【なみ】|線|【せん】の|言|【こと】|葉|【ば】')}「<span class="text-red-500 wavy-underline">${rubyHTML(q.target)}</span>」${rubyHTML('を')}<br/>
            ${rubyHTML('くわしく|説|【せつ】|明|【めい】している|修|【しゅう】|飾|【しょく】|語|【ご】を（　）に|書|【か】きましょう！')}
          </h2>

          <div class="text-xl md:text-3xl font-bold mb-6 p-4 md:p-6 rounded-2xl ${isBoss ? 'bg-gray-700 border-gray-600' : 'bg-gray-50 border-gray-200'} border-2 border-dashed leading-widest flex flex-wrap justify-center items-center gap-x-2 gap-y-4">
            ${textParts}
          </div>

          <div class="mb-6 flex flex-col md:flex-row items-center justify-center gap-3">
            <span class="hidden md:inline text-2xl font-bold ${isBoss ? 'text-white' : 'text-gray-800'}">（</span>
            <input 
              type="text" 
              id="answerInput"
              value="${userInput}" 
              oninput="userInput = this.value"
              onkeypress="if(event.key === 'Enter') checkAnswer()"
              placeholder="修飾語を入力..."
              ${feedback !== null ? 'disabled' : ''}
              class="w-full md:w-2/3 px-6 py-4 text-2xl font-bold text-center border-4 border-blue-400 rounded-2xl focus:outline-none focus:border-orange-500 transition shadow-inner ${isBoss ? 'bg-gray-900 text-white border-red-500' : 'bg-white text-gray-800'}"
            />
            <span class="hidden md:inline text-2xl font-bold ${isBoss ? 'text-white' : 'text-gray-800'}">）</span>
            <button 
              onclick="checkAnswer()" 
              ${feedback !== null ? 'disabled' : ''}
              class="w-full md:w-1/3 bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 px-6 rounded-2xl text-xl shadow-lg active:scale-95 transition">
              ${rubyHTML('こたえる！')}
            </button>
          </div>

          <div class="mb-4">
            ${showHint ? `
              <span class="bg-yellow-100 text-yellow-800 text-base md:text-lg font-bold px-4 py-2 rounded-xl border border-yellow-300">
                💡 ${rubyHTML('|最|【さい】|初|【しょ】の|文|【も】|字|【じ】')}：<strong>「 ${hintChar} 」</strong>
              </span>
            ` : `
              <button onclick="toggleHint()" class="text-sm font-bold text-gray-500 underline hover:text-orange-500 transition">
                💡 ${rubyHTML('ヒントをみる（1もじ|目|【め】）')}
              </button>
            `}
          </div>

          ${feedbackHtml}
        </div>
      `;

      setTimeout(() => {
        const inputEl = document.getElementById('answerInput');
        if (inputEl && feedback === null) {
          inputEl.focus();
        }
      }, 50);
    }

    window.onload = function() {
      render();
    };
  </script>
</body>
</html>
